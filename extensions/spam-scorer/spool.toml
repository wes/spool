[extension]
id = "spam-scorer"
name = "Spam Scorer"
version = "0.1.0"
description = "Scores and classifies mail with Jev, TypeSafe's typed-decision model."
authors = ["Spool"]
api = "0.2"

# What it uses, and nothing else.
#
# `modify-mail` is here for one command — filing the selection as spam, which
# you ask for by name. Nothing this extension does on its own moves mail: a
# classifier that files your inbox on a threshold it chose is a classifier you
# find out about by missing something.
#
# The network grant is one host. The URL is resolved before the request goes
# out, so the grant is "this extension may talk to Jev", not "this extension
# may talk to whatever it can spell".
capabilities = [
    "read-mail",
    "modify-mail",
    "ui",
    "storage",
    "net:https:api.typesafe.ai",
]

# Both have to be live to do their job, so declaring them is also what tells
# the host to start this with the app rather than on first use. `messages`
# only ever sees mail from mailboxes scoring is switched on for.
hooks = ["messages", "decorate"]

# Every label below is a filter above the list, named as the label is.
badge-filters = true

# Settings. The extension has no way to ask for these itself — WASI is linked
# empty and there is no text field in the UI vocabulary — so the host reads
# them from `config.toml` beside this file and seeds them before `init` runs.
[[config]]
key = "api-key"
title = "Jev API key"
description = "From https://typesafe.ai. Sent to api.typesafe.ai and nowhere else."
required = true
secret = true

[[config]]
key = "model"
title = "Model"
description = "Which System One model to ask. `jev-latest` unless you are pinning one."
default = "jev-latest"

[[config]]
key = "threshold"
title = "Spam threshold"
description = "0–4. At or above this, a message is badged as spam. 3 is bulk commercial mail."
default = "3"

[[config]]
key = "body"
title = "Send the body"
description = "`excerpt` sends the first 2000 characters of plain text to Jev. `none` sends only headers and the preview line."
default = "excerpt"

# What Jev sorts mail into. The name and definition are what it is asked —
# change either and the mail already scored is scored again — and `show`
# is whether a message it lands in is badged, rather than marked with a
# check like mail that passed.
[[config]]
key = "labels"
title = "Labels"
description = "What Jev sorts mail into. Changing a name or definition scores the switched-on mailboxes again."
fields = [
    { key = "name", title = "Label" },
    { key = "show", title = "Show", kind = "switch", default = "true" },
    { key = "definition", title = "What it means, for Jev", kind = "passage" },
]
rows = [
    { name = "Personal", show = "false", definition = "Written by a person to this person or to a small group including them, about something specific to them." },
    { name = "Receipt", show = "false", definition = "Generated by a service the recipient uses: a receipt, a password reset, a delivery notice, an alert, a calendar invitation." },
    { name = "Newsletter", definition = "A periodical sent to a list: a digest, a product update, a mailing list post, an industry roundup." },
    { name = "Promotion", definition = "Marketing for a product or service: an offer, a sale, a launch announcement, a webinar invitation." },
    { name = "Cold outreach", definition = "A first approach from a stranger who wants something specific: a sales pitch, a recruiter, a partnership or link request." },
    { name = "Fraud", definition = "Dishonest in intent: phishing for credentials or payment, impersonating a brand or person, advance-fee fraud, extortion, or delivering malware." },
]

[[config]]
key = "lookback"
title = "How far back"
description = "When scoring is switched on for a mailbox, the mail it goes back over."
default = "7d"
choices = ["24h", "7d", "30d", "365d"]

# Off in every mailbox until it is switched on from the bar above that
# mailbox's list. Switched on, the host hands over the mail from as far back
# as `lookback` says, then new mail as it arrives — and mail in a mailbox
# that is not switched on is never sent to Jev at all.
[scan]
title = "Spam scoring"
glyph = "⚖"
since = "lookback"

# The badges that are not labels, as filters with names of their own. Each
# is the badge it puts on a row; `Spam` also matches `Spam 3.4`.
[[filters]]
id = "clean"
title = "Clean"
badge = "✓"

[[filters]]
id = "spam"
title = "Spam"
badge = "Spam"

[[filters]]
id = "forged"
title = "Forged"
badge = "Forged"

[[commands]]
id = "score"
title = "Score the selection"

[[commands]]
id = "sweep"
title = "Score unscored mail here"

[[commands]]
id = "file"
title = "File the selection as spam"

